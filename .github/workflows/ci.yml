name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # run (and deploy) by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Benchmark
        run: cargo run --release --example bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the WebAssembly module
        run: scripts/build-web.sh
      - name: The module needs nothing from the browser
        run: |
          node -e "
            const m = new WebAssembly.Module(require('fs').readFileSync('web/sabbia.wasm'));
            const imports = WebAssembly.Module.imports(m);
            if (imports.length) { console.error('unexpected imports', imports); process.exit(1); }
            console.log('exports:', WebAssembly.Module.exports(m).map(e => e.name).join(', '));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web

  deploy:
    # Publishes the game to GitHub Pages from the default branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
